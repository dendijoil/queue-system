# Layanan pendukung untuk development lokal: PostgreSQL dan Redis.
# Jalankan dengan: pnpm infra:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: antrian
      POSTGRES_PASSWORD: antrian
      POSTGRES_DB: antrian
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Membuat role app_rw (tanpa BYPASSRLS) saat volume pertama kali dibuat
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U antrian']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
